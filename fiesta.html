<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fiesta infantil · Navidad 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500&family=Cormorant+Garamond:ital,wght@0,400;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#111111; --soft:#6f6f6f; --faint:#a8a8a8;
  --line:#e8e6e2; --warm:#f3efe9; --acento:#9b1c25;
  --borde:clamp(20px,3vw,44px); --hilo:max(38vh,290px); --asis-x:clamp(28px,7vw,110px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter Tight',Helvetica,Arial,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit}

#nieve{position:fixed;inset:0;pointer-events:none;z-index:0}

.pagina{position:relative;z-index:1;min-height:100vh;min-height:100svh;display:grid;grid-template-rows:auto auto auto auto;padding:var(--borde)}

/* ---------- Logo ---------- */
.top{display:flex;justify-content:center;padding-top:clamp(4px,1.5vh,18px)}
.logo{width:min(420px,70vw);height:auto;display:block}

/* ---------- Frase ---------- */
.hero{text-align:center;padding:clamp(56px,11vh,130px) 0 clamp(40px,7vh,80px)}
.kicker{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--soft);margin-bottom:clamp(22px,4.5vh,44px)}
.kicker i{display:inline-block;width:28px;height:1px;background:var(--faint);vertical-align:middle;margin:0 14px;font-style:normal}
.frase{font-weight:200;font-size:clamp(42px,7.6vw,124px);line-height:.98;letter-spacing:-.04em}
.frase em{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:300;letter-spacing:-.015em;color:var(--acento)}
.frase .l{display:block;overflow:hidden;padding-bottom:.06em}
.frase .l > span{display:inline-block;transform:translateY(105%);animation:sube 1.2s cubic-bezier(.2,.7,.1,1) forwards}
.frase .l:nth-child(2) > span{animation-delay:.14s}
.frase .l:nth-child(3) > span{animation-delay:.28s}
@keyframes sube{to{transform:none}}
@keyframes aparece{to{opacity:1}}

/* ---------- Base ---------- */
.base{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;opacity:0;animation:aparece 1s 1.1s forwards}
.firma{font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--faint);writing-mode:vertical-rl;transform:rotate(180deg)}

/* ---------- Asistente ---------- */
.asis{position:fixed;top:0;right:var(--asis-x);z-index:20;display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;animation:balanceo 5.5s ease-in-out infinite}
.hilo{width:1px;height:var(--hilo);background:var(--ink);transform-origin:top;animation:baja 1.4s cubic-bezier(.3,.8,.2,1) both}
.bola{background:none;border:0;cursor:pointer;display:block;width:78px;animation:aparece .6s .9s both}
.bola svg{display:block;width:100%;height:auto;overflow:visible}
.bola:focus-visible{outline:1px solid var(--ink);outline-offset:6px}
.asis-nombre{margin-top:8px;font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:var(--soft);animation:aparece .6s 1.2s both}
.asis.salta .bola svg{animation:salto .7s cubic-bezier(.3,1.6,.5,1)}
.ojos{transition:transform .5s}
.asis.mira .ojos{transform:translateY(2px)}
.parpado{transform-box:fill-box;transform-origin:center;animation:parpadeo 5s infinite}
@keyframes balanceo{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-2deg)}}
@keyframes baja{from{transform:scaleY(0)}}
@keyframes salto{0%{transform:none}35%{transform:translateY(-9px) rotate(-4deg)}100%{transform:none}}
@keyframes parpadeo{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}

/* ---------- Cartel ---------- */
.cartel{position:fixed;z-index:19;--cr:max(var(--borde),calc(var(--asis-x) - 60px));top:calc(var(--hilo) + 134px);right:var(--cr);width:300px;background:#fff;border:1px solid var(--ink);padding:20px 22px 0;opacity:0;transform:translateY(-8px);transition:opacity .45s,transform .45s cubic-bezier(.2,.7,.1,1);pointer-events:none}
.cartel.on{opacity:1;transform:none;pointer-events:auto}
.flecha{position:absolute;top:-6px;right:calc(var(--asis-x) + 39px - var(--cr) - 6px);width:11px;height:11px;background:#fff;border-top:1px solid var(--ink);border-left:1px solid var(--ink);transform:rotate(45deg)}
.c-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--soft);margin-bottom:14px}
.c-nuevo{color:var(--acento);font-weight:500}
.c-x{background:none;border:0;cursor:pointer;font-size:16px;font-weight:200;line-height:1;margin:-4px -6px 0 auto;padding:2px 6px;color:var(--soft)}
.c-x:hover{color:var(--ink)}
.c-tit{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:27px;line-height:1.04;letter-spacing:-.01em;margin-bottom:10px}
.c-txt{font-size:13px;line-height:1.55;color:#3a3a3a}
.c-pie{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;padding:12px 0 14px;border-top:1px solid var(--line);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
.c-pie a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:1px}
.c-puntos{display:flex;gap:5px}
.c-puntos button{width:14px;height:9px;border:0;background:none;cursor:pointer;position:relative}
.c-puntos button::after{content:"";position:absolute;left:0;right:0;top:4px;height:1px;background:var(--line)}
.c-puntos button.on::after{background:var(--ink)}
.c-prog{position:absolute;left:-1px;bottom:-1px;height:1px;background:var(--ink);width:0}

/* ---------- Responsive ---------- */
@media (max-width:760px){
  .indice{grid-template-columns:repeat(2,1fr)}
  .arbol{width:min(250px,72%)}
  .lab{display:none}
  .leyenda{display:block;width:100%;margin:-40px 0 56px;border-top:1px solid var(--ink)}
  .ley-fila{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:14px}
  .ley-fila span:last-child{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);white-space:nowrap}
  :root{--hilo:7vh;--asis-x:18px}
  .top{justify-content:flex-start;padding-right:80px}
  .logo{width:min(300px,62vw)}
  .bola{width:54px}
  .asis-nombre{font-size:8px}
  .hero{text-align:left;padding:72px 0 56px}
  .kicker i{width:14px;margin:0 8px}
  .base{flex-direction:column;align-items:stretch}
  .cal{width:100%}
  .firma{display:none}
  .cartel{top:auto;bottom:16px;left:16px;right:16px;width:auto;transform:translateY(14px);box-shadow:0 18px 50px rgba(0,0,0,.12)}
  .flecha{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .frase .l > span{transform:none}
  .base{opacity:1}
}

/* ---------- Cabecera de sección ---------- */
.top{position:relative}
.volver-top{position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--soft);text-decoration:none;transition:color .3s}
.volver-top:hover{color:var(--ink)}
.hero{padding:clamp(48px,9vh,110px) 0 clamp(48px,8vh,96px)}
.frase{font-size:clamp(40px,6.4vw,104px)}

/* ---------- Entradas ---------- */
.entradas{width:min(620px,100%);margin:clamp(40px,7vh,80px) auto clamp(64px,11vh,120px);display:grid;grid-template-columns:repeat(2,1fr);gap:96px 32px}
.entrada{position:relative;display:grid;grid-template-columns:62px 1fr;min-height:128px;text-decoration:none;color:inherit;cursor:pointer;opacity:0;animation:llega .9s cubic-bezier(.2,.7,.1,1) forwards;transition:transform .5s cubic-bezier(.2,.7,.1,1)}
@keyframes llega{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.talon,.cuerpo{border:1px solid var(--ink);background:#fff;transition:background .4s,transform .5s cubic-bezier(.2,.7,.1,1)}
.talon{border-right:0;display:grid;place-items:center;position:relative}
.talon span{font-weight:200;font-size:26px;letter-spacing:-.02em;transform:rotate(-90deg)}
.cuerpo{border-left:1px dashed var(--ink);padding:16px 18px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;position:relative}
.cuerpo::before,.cuerpo::after{content:"";position:absolute;left:-8px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:1px solid var(--ink)}
.cuerpo::before{top:-8px;border-top-color:transparent;border-left-color:transparent;transform:rotate(45deg)}
.cuerpo::after{bottom:-8px;border-bottom-color:transparent;border-right-color:transparent;transform:rotate(45deg)}
.en-sup{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
.en-nom{font-size:17px;font-weight:300;line-height:1.2}
.en-ir{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);transition:color .35s}
.entrada:not(.pronto) .en-ir{font-size:12px;letter-spacing:0}
.entrada:hover{transform:rotate(-1.2deg) translateY(-3px)}
.entrada:hover .cuerpo{background:var(--warm)}
.entrada:hover .talon{transform:translateX(-5px) rotate(-2deg)}
.entrada:hover .en-ir{color:var(--ink)}
.entradas.foco .entrada:not(:hover){opacity:.4 !important}

/* ---------- Desplegables ---------- */
.entradas{position:relative}
.entrada.desp{transition:none}
.entrada.desp:hover{transform:none}
.entrada.abierta{z-index:6}
.entrada.abierta .cuerpo{background:var(--warm)}
.panel{position:absolute;top:100%;left:0;width:100%;padding-top:16px;cursor:default;visibility:hidden;transition:visibility 0s .6s}
.entrada.abierta .panel{visibility:visible;transition:none}
.panel-in{background:var(--ink);color:#f3efe9;box-shadow:0 40px 90px -30px rgba(0,0,0,.55);clip-path:inset(0 0 100% 0);transition:clip-path .7s cubic-bezier(.7,0,.2,1)}
.entrada.abierta .panel-in{clip-path:inset(0 0 0 0)}
.panel-in > *{opacity:0;transform:translateY(14px);transition:opacity .4s,transform .7s cubic-bezier(.2,.7,.1,1)}
.entrada.abierta .panel-in > *{opacity:1;transform:none;transition-delay:.25s}
.panel-img img{display:block;width:100%;max-height:78vh;object-fit:contain;background:var(--ink)}
.panel-vacio{display:grid;place-items:center;aspect-ratio:16/8;text-align:center;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(243,239,233,.6)}
.panel-vacio em{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:clamp(48px,6vw,88px);letter-spacing:-.01em;text-transform:none;color:#f3efe9;line-height:1}
.agenda{display:grid;grid-template-columns:minmax(220px,.8fr) 2fr;gap:clamp(28px,5vw,72px);padding:clamp(32px,5vw,64px)}
.ag-cab{display:flex;flex-direction:column;gap:14px;padding-right:clamp(20px,3vw,48px);border-right:1px solid rgba(243,239,233,.25)}
.ag-dia{font-weight:200;font-size:clamp(110px,13vw,190px);letter-spacing:-.06em;line-height:.8}
.ag-mes{display:flex;flex-direction:column;gap:6px;font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:rgba(243,239,233,.6)}
.ag-mes b{font-weight:400;color:#f3efe9;font-size:12px}
.ag-lugar{margin-top:auto;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:26px;line-height:1.1;color:#e3b7ba}
.ag-lista{display:flex;flex-direction:column}
.ag-blq{display:grid;grid-template-columns:clamp(110px,11vw,170px) 1fr;gap:24px;padding:22px 0;border-bottom:1px solid rgba(243,239,233,.18)}
.ag-blq:first-child{padding-top:4px}
.ag-blq:last-child{border-bottom:0;padding-bottom:0}
.ag-hora{font-weight:200;font-size:clamp(44px,5vw,72px);letter-spacing:-.04em;line-height:.9;position:relative}
.ag-hora::before{content:"";position:absolute;left:-18px;top:.35em;width:8px;height:8px;border-radius:50%;background:var(--acento);box-shadow:0 0 0 4px rgba(155,28,37,.25)}
.ag-tit{font-size:clamp(18px,1.7vw,24px);font-weight:300;margin-bottom:14px;line-height:1.2}
.ag-items{display:flex;flex-wrap:wrap;gap:8px}
.ag-items span{font-size:12px;border:1px solid rgba(243,239,233,.35);padding:7px 13px 6px;border-radius:99px}
.cartelera{padding:clamp(28px,4vw,52px)}
.cart-cab{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:clamp(24px,3.5vw,40px)}
.bombillas{display:flex;gap:14px}
.bombillas i{width:6px;height:6px;border-radius:50%;background:#f1d9a0;box-shadow:0 0 8px 2px rgba(241,217,160,.55);animation:bombilla 1.6s ease-in-out infinite}
.bombillas i:nth-child(even){animation-delay:.8s}
@keyframes bombilla{0%,100%{opacity:1}50%{opacity:.25}}
.cart-tit{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:300;font-size:clamp(40px,4.6vw,64px);line-height:1}
.cart-sub{font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;color:rgba(243,239,233,.6)}
.pelis{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(16px,2.2vw,28px)}
.peli-cartel{position:relative;aspect-ratio:2/3;overflow:hidden;background:#1d1d1d;border:1px solid rgba(243,239,233,.18)}
.peli-cartel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.2,.7,.1,1)}
.peli:hover .peli-cartel img{transform:scale(1.05)}
.peli-vacio{position:absolute;inset:10px;border:1px dashed rgba(243,239,233,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.peli-vacio em{font-family:'Cormorant Garamond',Georgia,serif;font-size:54px;font-weight:300;line-height:1;color:rgba(243,239,233,.85)}
.peli-vacio span{font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;color:rgba(243,239,233,.5)}
.peli-nom{margin-top:14px;font-size:clamp(15px,1.4vw,18px);font-weight:300;line-height:1.25}
.peli-nom.vacio{color:rgba(243,239,233,.5)}
.peli-desc{margin-top:6px;font-size:12px;line-height:1.5;color:rgba(243,239,233,.7)}
.peli-datos{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.peli-datos span{font-size:9px;letter-spacing:.2em;text-transform:uppercase;border:1px solid rgba(243,239,233,.35);padding:5px 9px 4px}
.peli-datos .edad{background:#f3efe9;color:var(--ink);border-color:#f3efe9;font-weight:500}
.entrada.desp .en-ir{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft)}

/* ---------- Papá Noel ---------- */
.santa{position:absolute;left:0;top:0;z-index:5;width:84px;height:101px;cursor:pointer;opacity:0;transition:opacity .6s;will-change:transform;-webkit-tap-highlight-color:transparent}
.santa.visible{opacity:1}
.santa-mueve{width:100%;height:100%;transform-origin:50% 100%;transition:transform .18s cubic-bezier(.3,.7,.4,1)}
.santa-cuerpo{width:100%;height:100%;transform-origin:50% 100%;transition:transform .4s cubic-bezier(.3,.7,.4,1)}
.santa.izq .santa-cuerpo{transform:scaleX(-1)}
.santa svg{display:block;width:100%;height:100%;overflow:visible}
.santa .tr{stroke:#1c1c1c;stroke-width:1;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.santa svg g{transform-box:view-box}
/* respiración y cabeza: siempre, muy suave */
.sn-torso{transform-origin:50px 95px;animation:sn-respira 3.2s ease-in-out infinite}
@keyframes sn-respira{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.022)}}
.sn-cabeza{transform-origin:49px 46px;animation:sn-cabeza 4.6s ease-in-out infinite}
@keyframes sn-cabeza{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.5deg)}}
.sn-ojos{transform-origin:49px 31.6px;animation:sn-parpadeo 4.2s infinite}
@keyframes sn-parpadeo{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.sn-ojos-rie{display:none}
.sn-boca{transform-origin:49px 43px;transform:scale(.6,.4)}
.sn-saco{transform-origin:66px 46px;animation:sn-saco 3.2s ease-in-out infinite}
@keyframes sn-saco{0%,100%{transform:rotate(0)}50%{transform:rotate(1.5deg)}}
/* brazo: reposo casi abajo; al saludar se mueve la mano */
.sn-brazo-saluda{transform-origin:35px 50px;transform:rotate(-128deg);transition:transform .5s cubic-bezier(.3,.7,.4,1)}
.santa.saluda .sn-brazo-saluda{transform:rotate(0);animation:sn-saluda .55s .45s ease-in-out 4 alternate}
@keyframes sn-saluda{from{transform:rotate(0)}to{transform:rotate(-16deg)}}
/* andar */
.sn-pierna{transform-origin:center 92px}
.sn-pierna.i{transform-origin:42px 92px}.sn-pierna.d{transform-origin:58px 92px}
.santa.anda .sn-pierna.i{animation:sn-paso .46s ease-in-out infinite alternate}
.santa.anda .sn-pierna.d{animation:sn-paso .46s ease-in-out infinite alternate-reverse}
@keyframes sn-paso{from{transform:rotate(13deg)}to{transform:rotate(-13deg)}}
.santa.anda .sn-torso{animation:sn-bote .23s ease-in-out infinite alternate}
@keyframes sn-bote{from{transform:translateY(0)}to{transform:translateY(-1.8px)}}
/* reírse */
.santa.rie .sn-ojos{display:none}
.santa.rie .sn-ojos-rie{display:inline}
.santa.rie .sn-boca{transform:scale(1)}
.santa.rie .sn-cabeza{animation:sn-cabeza-rie .5s ease-in-out infinite alternate}
@keyframes sn-cabeza-rie{from{transform:rotate(-6deg) translateY(-1px)}to{transform:rotate(-2deg) translateY(.5px)}}
.santa.rie .sn-torso{animation:sn-barriga .16s ease-in-out infinite alternate}
@keyframes sn-barriga{from{transform:scale(1,1)}to{transform:scale(1.03,.975)}}
/* salto: se agacha, se estira en el aire y amortigua al caer */
.santa.agacha .santa-mueve{transform:scale(1.1,.84)}
.santa.vuela .santa-mueve{transform:scale(.94,1.08)}
.santa.vuela .sn-pierna.i{transform:rotate(-14deg)}.santa.vuela .sn-pierna.d{transform:rotate(12deg)}
.santa.cae .santa-mueve{transform:scale(1.12,.86)}
.santa-bocadillo{position:absolute;left:50%;bottom:100%;margin-bottom:-2px;transform:translate(-50%,6px);white-space:nowrap;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:20px;color:var(--acento);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
.santa.rie .santa-bocadillo{opacity:1;transform:translate(-50%,0)}
@media (max-width:760px){.santa{width:70px;height:84px}.santa-bocadillo{font-size:17px}}
@media (prefers-reduced-motion:reduce){.santa *{animation:none !important}}

.pie{display:flex;justify-content:center;padding-bottom:12px}
.pie a{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--soft);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:3px}
.pie a:hover{color:var(--ink);border-color:var(--ink)}

@media (max-width:760px){
  .volver-top{position:static;transform:none;display:block;margin-bottom:14px}
  .top{flex-direction:column;align-items:flex-start}
  .entradas{grid-template-columns:1fr;gap:76px}
  .panel{position:static;grid-column:1 / -1;display:none;width:auto !important;padding-top:12px}
  .entrada.abierta .panel{display:block}
  .agenda{grid-template-columns:1fr;gap:22px;padding:28px 22px}
  .ag-cab{flex-direction:row;align-items:flex-end;gap:16px;padding:0 0 18px;border-right:0;border-bottom:1px solid rgba(243,239,233,.25)}
  .ag-dia{font-size:96px}
  .ag-lugar{display:none}
  .ag-blq{grid-template-columns:1fr;gap:10px;padding:18px 0 18px 18px}
  .ag-hora{font-size:44px}
  .ag-hora::before{left:-18px}
  .cartelera{padding:26px 18px}
  .cart-sub{letter-spacing:.18em;text-align:center;line-height:1.6}
  .pelis{grid-template-columns:repeat(2,1fr);gap:22px 14px}
  .peli-vacio em{font-size:40px}
}

</style>
</head>
<body>
<canvas id="nieve" aria-hidden="true"></canvas>

<div class="pagina">
  <header class="top">
    <a class="volver-top" href="index.html">← Navidad 2026</a>
    <a href="index.html"><img class="logo" src="logo.png" alt="Plataforma Europa · Inditex"></a>
  </header>

  <main class="hero">
    <p class="kicker" id="kicker"></p>
    <h1 class="frase" id="frase"></h1>
  </main>

  <nav class="entradas" id="entradas" aria-label="Apartados de la Fiesta infantil"></nav>

<script>
/* =====================================================================
   CONFIGURACIÓN DE LA FIESTA INFANTIL — todo lo que se cambia está aquí
   ===================================================================== */
const CONFIG = {

  antetitulo: "Navidad 2026|20 de diciembre",   // "|" separa con una línea fina
  frase: "Fiesta *infantil*",                  // *palabra* = cursiva en rojo

  // Apartados (cada uno es una entrada).
  //   despliega: "imagen" → al pasar el ratón se abre la imagen (campo imagen)
  //   despliega: "agenda" → al pasar el ratón se abre la agenda de horarios (ver "agenda")
  //   despliega: "cartelera" → al pasar el ratón se abre la cartelera de películas (ver "cartelera")
  //   enlace: abre otra página o formulario. Vacío y sin despliegue → "Próximamente".
  apartados: [
    { nombre: "Temática",          despliega: "imagen", imagen: "img/tematica.jpg" },   // sube la imagen a la carpeta img con ese nombre exacto
    { nombre: "Fecha y horarios",  despliega: "agenda" },
    { nombre: "Elige tu peli",     despliega: "cartelera" },
    { nombre: "Inscripciones",     enlace: "" }
  ],

  // Agenda de la fiesta (apartado "Fecha y horarios")
  agenda: {
    fecha: "2026-12-20",
    lema: "¡Os esperamos!",   // frase opcional bajo la fecha (vacía = no se muestra)
    bloques: [
      { hora: "10:30", titulo: "Comienza la fiesta",
        items: ["Barra libre de chucherías", "Zona baby", "Personajes de animación", "Papá Noel", "Photocall"] },
      { hora: "11:15", titulo: "Proyección de películas",
        items: ["Proyección de las distintas películas"] }
    ]
  },

  // Cartelera (apartado "Elige tu peli"). Rellena cada película cuando esté confirmada.
  //   cartel: ruta a la imagen del cartel, en vertical (ej. "img/peli-1.jpg"); vacío = hueco "Próximamente"
  //   edad: edad recomendada (ej. "TP", "+7")   duracion: en minutos (ej. 95)
  cartelera: [
    { titulo: "", descripcion: "", edad: "", duracion: "", cartel: "" },
    { titulo: "", descripcion: "", edad: "", duracion: "", cartel: "" },
    { titulo: "", descripcion: "", edad: "", duracion: "", cartel: "" },
    { titulo: "", descripcion: "", edad: "", duracion: "", cartel: "" }
  ],

  asistente: {
    nombre: "Noa",
    activo: true,
    segundos: 8,
    vueltas: 1,
    diasNuevo: 3,
    saludo: {
      titulo: "¡Bienvenidos a la fiesta!",
      texto: "Aquí te iré avisando de todo lo importante de la fiesta infantil."
    }
  },

  // Mensajes de Noa en esta página. importante: true → etiqueta "Importante" en rojo.
  avisos: [
    { fecha: "2026-10-21", evento: "Fiesta infantil", importante: true,
      titulo: "Guarda la fecha: 20 de diciembre",
      texto: "Muy pronto publicaremos la temática, los horarios, las películas y las inscripciones.",
      enlace: "" }
  ],

  nieve: true
};
/* ===================================================================== */

(function () {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const hoy = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
  const key = d => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  const corto = d => new Intl.DateTimeFormat('es-ES', { day:'numeric', month:'short' }).format(d).replace('.', '').toUpperCase();
  const mesTxt = d => new Intl.DateTimeFormat('es-ES', { month:'long', year:'numeric' }).format(d).replace(' de ', ' ');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Frase ---------- */
  $('frase').innerHTML = CONFIG.frase.split('|').map(l =>
    `<span class="l"><span>${esc(l).replace(/\*(.+?)\*/g, '<em>$1</em>')}</span></span>`).join('');

  /* ---------- Antetítulo ---------- */
  $('kicker').innerHTML = CONFIG.antetitulo.split('|').map(esc).join(' <i></i> ');

  /* ---------- Entradas ---------- */
  const caja = $('entradas');
  const toque = matchMedia('(hover: none), (max-width: 760px)');
  function agendaHTML() {
    const G = CONFIG.agenda, d = parse(G.fecha);
    const dia = new Intl.DateTimeFormat('es-ES', { weekday:'long' }).format(d);
    const mes = new Intl.DateTimeFormat('es-ES', { month:'long', year:'numeric' }).format(d).replace(' de ', ' ');
    return `<div class="agenda">
      <div class="ag-cab"><span class="ag-dia">${d.getDate()}</span><span class="ag-mes"><b>${esc(dia)}</b>${esc(mes)}</span>${G.lema ? `<span class="ag-lugar">${esc(G.lema)}</span>` : ''}</div>
      <div class="ag-lista">${G.bloques.map(b => `<div class="ag-blq"><span class="ag-hora">${esc(b.hora)}</span>
        <div><div class="ag-tit">${esc(b.titulo)}</div><div class="ag-items">${(b.items || []).map(t => `<span>${esc(t)}</span>`).join('')}</div></div></div>`).join('')}</div>
    </div>`;
  }
  function carteleraHTML() {
    const bombillas = '<div class="bombillas">' + '<i></i>'.repeat(9) + '</div>';
    return `<div class="cartelera">
      <div class="cart-cab">${bombillas}<span class="cart-tit">En cartelera</span><span class="cart-sub">Elige tu peli · 20 de diciembre · 11:15</span></div>
      <div class="pelis">${CONFIG.cartelera.map((f, n) => {
        const num = String(n + 1).padStart(2, '0');
        const cartel = f.cartel ? `<img src="${esc(f.cartel)}" alt="${esc(f.titulo)}" loading="lazy">`
          : `<div class="peli-vacio"><em>${num}</em><span>Próximamente</span></div>`;
        const datos = [f.edad ? `<span class="edad">${esc(f.edad)}</span>` : '', f.duracion ? `<span>${esc(f.duracion)} min</span>` : ''].join('');
        return `<div class="peli"><div class="peli-cartel">${cartel}</div>
          <div class="peli-nom${f.titulo ? '' : ' vacio'}">${f.titulo ? esc(f.titulo) : 'Película por anunciar'}</div>
          ${f.descripcion ? `<div class="peli-desc">${esc(f.descripcion)}</div>` : ''}
          ${datos ? `<div class="peli-datos">${datos}</div>` : ''}</div>`;
      }).join('')}</div>
    </div>`;
  }
  function panelHTML(a) {
    if (a.despliega === 'agenda') return agendaHTML();
    if (a.despliega === 'cartelera') return carteleraHTML();
    if (a.despliega === 'imagen') return a.imagen
      ? `<div class="panel-img"><img src="${esc(a.imagen)}" alt="${esc(a.nombre)}" onerror="this.parentNode.outerHTML='<div class=&quot;panel-vacio&quot;><span><em>${esc(a.nombre)}</em><br><br>Imagen próximamente</span></div>'"></div>`
      : `<div class="panel-vacio"><span><em>${esc(a.nombre)}</em><br><br>Imagen próximamente</span></div>`;
    return '';
  }
  caja.innerHTML = CONFIG.apartados.map((a, n) => {
    const desp = !!a.despliega;
    const tag = a.enlace && !desp ? 'a' : 'div';
    const ir = desp ? (toque.matches ? 'Toca para ver ↓' : 'Ver ↓') : a.enlace ? '→' : 'Próximamente';
    const ext = a.enlace && /^https?:/.test(a.enlace) ? ' target="_blank" rel="noopener"' : '';
    return `<${tag} class="entrada${desp ? ' desp' : a.enlace ? '' : ' pronto'}" style="animation-delay:${1 + n * .12}s"${tag === 'a' ? ` href="${esc(a.enlace)}"${ext}` : ''}${desp ? ` data-n="${n}" tabindex="0" aria-expanded="false"` : ''}>
      <span class="talon"><span>${String(n + 1).padStart(2, '0')}</span></span>
      <span class="cuerpo">
        <span class="en-sup">Fiesta infantil · 20 dic</span>
        <span class="en-nom">${esc(a.nombre)}</span>
        <span class="en-ir">${ir}</span>
      </span>
      ${desp ? `<div class="panel"><div class="panel-in">${panelHTML(a)}</div></div>` : ''}</${tag}>`;
  }).join('');

  // El panel ocupa el ancho de las dos columnas, empezando bajo su entrada
  function colocar(ent) {
    const pnl = ent.querySelector('.panel'); if (!pnl || toque.matches) return;
    // Ancho grande (hasta 1100 px), centrado en la pantalla
    const w = Math.min(1100, document.documentElement.clientWidth - 32);
    pnl.style.width = w + 'px';
    pnl.style.left = ((document.documentElement.clientWidth - w) / 2 - ent.getBoundingClientRect().left) + 'px';
  }
  function abrirPanel(ent) {
    caja.querySelectorAll('.entrada.abierta').forEach(e => { if (e !== ent) cerrarPanel(e); });
    colocar(ent); ent.classList.add('abierta'); ent.setAttribute('aria-expanded', 'true');
    if (typeof cerrarCartel === 'function') cerrarCartel();
  }
  function cerrarPanel(ent) { ent.classList.remove('abierta'); ent.setAttribute('aria-expanded', 'false'); }
  caja.querySelectorAll('.entrada.desp').forEach(ent => {
    ent.addEventListener('mouseenter', () => { if (!toque.matches) abrirPanel(ent); });
    ent.addEventListener('mouseleave', () => { if (!toque.matches) cerrarPanel(ent); });
    ent.addEventListener('click', e => {
      if (!toque.matches || e.target.closest('.panel')) return;
      ent.classList.contains('abierta') ? cerrarPanel(ent) : abrirPanel(ent);
    });
    ent.addEventListener('focus', () => { if (!toque.matches) abrirPanel(ent); });
    ent.addEventListener('blur', () => { if (!toque.matches) cerrarPanel(ent); });
  });
  addEventListener('resize', () => caja.querySelectorAll('.entrada.abierta').forEach(colocar));

  caja.addEventListener('mouseenter', () => { caja.classList.add('foco'); if (typeof cerrarCartel === 'function') cerrarCartel(); });
  caja.addEventListener('mouseleave', () => caja.classList.remove('foco'));

  /* ---------- Papá Noel ---------- */
  (() => {
    const s = $('santa'); if (!s) return;
    const reducido = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let actual = -1, pos = { x: 0, y: 0 }, ocupado = false;
    const ents = () => [...caja.querySelectorAll('.entrada')];
    const espera = ms => new Promise(r => setTimeout(r, ms));
    // Los pies se apoyan en el borde superior de la entrada (coordenadas de página)
    function borde(i) {
      const r = ents()[i].getBoundingClientRect();
      return { l: r.left + scrollX + 52, r: r.right + scrollX - 40, y: r.top + scrollY + 1 };
    }
    const puntoEn = (i, frac = .3 + Math.random() * .5) => { const b = borde(i); return { x: b.l + (b.r - b.l) * frac, y: b.y }; };
    function colocar(p) {
      pos = p;
      s.style.transform = `translate(${p.x - s.offsetWidth / 2}px, ${p.y - s.offsetHeight}px)`;
    }
    const mira = x => s.classList.toggle('izq', x < pos.x);
    function animar(dur, f) {
      return new Promise(res => {
        const t0 = performance.now();
        (function paso(t) { const k = Math.min(1, (t - t0) / dur); f(k); k < 1 ? requestAnimationFrame(paso) : res(); })(t0);
      });
    }
    const suave = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;

    async function andar(x) {
      if (Math.abs(x - pos.x) < 8) return;
      mira(x); s.classList.add('anda');
      const o = { ...pos }, dur = Math.abs(x - o.x) * 22;   // paso tranquilo
      await animar(dur, k => colocar({ x: o.x + (x - o.x) * k, y: o.y }));
      s.classList.remove('anda');
    }
    async function saltar(destino, dur = 820) {
      mira(destino.x);
      s.classList.add('agacha'); await espera(200); s.classList.remove('agacha');
      s.classList.add('vuela');
      const o = { ...pos }, alto = Math.min(o.y, destino.y) - 95;
      await animar(dur, k => {
        const e = suave(k);
        colocar({ x: o.x + (destino.x - o.x) * e, y: o.y + (destino.y - o.y) * e - 4 * (Math.min(o.y, destino.y) - alto) * k * (1 - k) });
      });
      s.classList.remove('vuela'); s.classList.add('cae'); await espera(160); s.classList.remove('cae');
    }
    async function reir(ms = 1900) { s.classList.add('rie'); await espera(ms); s.classList.remove('rie'); }
    async function saludar() { s.classList.add('saluda'); await espera(2900); s.classList.remove('saluda'); await espera(400); }
    function otraVisible() {
      const vis = ents().map((e, i) => ({ i, r: e.getBoundingClientRect() }))
        .filter(o => o.i !== actual && o.r.top > 110 && o.r.top < innerHeight - 20).map(o => o.i);
      return vis.length ? vis[Math.floor(Math.random() * vis.length)] : -1;
    }
    async function vida() {
      actual = otraVisible(); if (actual < 0) actual = 0;
      const meta = puntoEn(actual);
      colocar({ x: meta.x, y: scrollY - 140 }); s.classList.add('visible', 'vuela');
      await animar(900, k => colocar({ x: meta.x, y: scrollY - 140 + (meta.y - scrollY + 140) * (k * k) }));
      s.classList.remove('vuela'); s.classList.add('cae'); await espera(180); s.classList.remove('cae');
      await reir();
      while (true) {
        await espera(1800 + Math.random() * 2600);
        if (ocupado) continue;
        const r = Math.random();
        if (r < .22) await reir();
        else if (r < .44) await saludar();
        else if (r < .7) { const b = borde(actual); await andar(b.l + (b.r - b.l) * Math.random()); }
        else { const i = otraVisible(); if (i >= 0) { await saltar(puntoEn(i)); actual = i; } else await saludar(); }
      }
    }
    s.addEventListener('click', async () => { if (ocupado) return; ocupado = true; await reir(1500); ocupado = false; });
    addEventListener('resize', () => { if (actual >= 0) colocar(puntoEn(actual, .5)); });
    if (reducido) { actual = 0; s.classList.add('visible'); setTimeout(() => colocar(puntoEn(0, .5)), 1600); }
    else setTimeout(vida, 1900);
  })();

  /* ---------- Asistente ---------- */
  let cerrarCartel = null;
  const A = CONFIG.asistente, asis = $('asis'), cartel = $('cartel');
  if (!A.activo) { asis.remove(); cartel.remove(); }
  else {
    $('asisNombre').textContent = A.nombre;
    const avisos = [...CONFIG.avisos].sort((x, y) => y.fecha.localeCompare(x.fecha));
    const lista = (A.saludo ? [{ saludo: true, evento: A.nombre, titulo: A.saludo.titulo, texto: A.saludo.texto }] : []).concat(avisos);
    let i = 0, mostrados = 0, timer = null, pausa = false, abierto = false;

    const relativo = f => {
      const dias = Math.round((hoy - parse(f)) / 864e5);
      if (dias <= 0) return 'Hoy'; if (dias === 1) return 'Ayer';
      if (dias < 7) return 'Hace ' + dias + ' días'; return corto(parse(f));
    };

    function pinta() {
      const a = lista[i];
      $('cEvento').textContent = a.evento || '';
      const nuevo = !a.saludo && a.fecha && (hoy - parse(a.fecha)) / 864e5 <= A.diasNuevo;
      $('cNuevo').textContent = a.importante ? 'Importante' : (nuevo ? 'Nuevo' : '');
      $('cTit').textContent = a.titulo;
      $('cTxt').textContent = a.texto;
      $('cFecha').textContent = a.saludo ? '' : relativo(a.fecha);
      $('cLink').innerHTML = a.enlace ? `<a href="${esc(a.enlace)}">Ver más</a>` : '';
      $('cPuntos').innerHTML = lista.length > 1 ? lista.map((_, n) => `<button class="${n === i ? 'on' : ''}" data-n="${n}" aria-label="Aviso ${n + 1}"></button>`).join('') : '';
      const p = $('cProg'); p.style.transition = 'none'; p.style.width = '0';
      if (!pausa && !reduce) requestAnimationFrame(() => requestAnimationFrame(() => { p.style.transition = `width ${A.segundos}s linear`; p.style.width = 'calc(100% + 2px)'; }));
      asis.classList.remove('salta'); void asis.offsetWidth; asis.classList.add('salta');
    }
    function abrir(n = 0) { i = n; abierto = true; cartel.classList.add('on'); asis.classList.add('mira'); pinta(); programar(); }
    function cerrar() { abierto = false; cartel.classList.remove('on'); asis.classList.remove('mira'); clearTimeout(timer); }
    cerrarCartel = () => { if (abierto) cerrar(); };
    function programar() {
      clearTimeout(timer);
      if (pausa) return;
      timer = setTimeout(() => {
        mostrados++;
        if (A.vueltas && mostrados >= lista.length * A.vueltas) return cerrar();
        i = (i + 1) % lista.length; pinta(); programar();
      }, A.segundos * 1000);
    }

    $('bola').onclick = () => abierto ? cerrar() : (mostrados = 0, abrir(A.saludo && avisos.length ? 1 : 0));
    $('cX').onclick = cerrar;
    $('cPuntos').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { i = +b.dataset.n; pinta(); programar(); } });
    cartel.addEventListener('mouseenter', () => { pausa = true; clearTimeout(timer); const p = $('cProg'); p.style.transition = 'none'; });
    cartel.addEventListener('mouseleave', () => { pausa = false; pinta(); programar(); });
    setTimeout(() => abrir(0), 1900);
  }

  /* ---------- Nieve ---------- */
  if (CONFIG.nieve && !reduce) {
    const cv = $('nieve'), ctx = cv.getContext('2d');
    let W, H, copos = [];
    const crea = () => {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = W < 760 ? 22 : 44;
      copos = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, r: .6 + Math.random() * 1.5, v: .12 + Math.random() * .32, f: Math.random() * 6.28 }));
    };
    const ciclo = () => {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(176,166,150,.45)';
      for (const c of copos) {
        c.y += c.v; c.f += .008; c.x += Math.sin(c.f) * .18;
        if (c.y > H + 4) { c.y = -4; c.x = Math.random() * W; }
        ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, 6.283); ctx.fill();
      }
      requestAnimationFrame(ciclo);
    };
    crea(); addEventListener('resize', crea); ciclo();
  }
})();
</script>
</body>
</html>
