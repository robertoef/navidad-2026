<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Navidad 2026 · Plataforma Europa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500&family=Cormorant+Garamond:ital,wght@0,400;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#111111; --soft:#6f6f6f; --faint:#a8a8a8;
  --line:#e8e6e2; --warm:#f3efe9; --acento:#9b1c25;
  --borde:clamp(20px,3vw,44px); --hilo:max(38vh,290px); --asis-x:clamp(28px,7vw,110px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter Tight',Helvetica,Arial,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit}

#nieve{position:fixed;inset:0;pointer-events:none;z-index:0}

.pagina{position:relative;z-index:1;min-height:100vh;min-height:100svh;display:grid;grid-template-rows:auto auto auto auto;grid-template-columns:minmax(0,1fr);padding:var(--borde)}

/* ---------- Logo ---------- */
.top{display:flex;justify-content:center;padding-top:clamp(4px,1.5vh,18px)}
.logo{width:min(420px,70vw);height:auto;display:block}

/* ---------- Frase ---------- */
.hero{text-align:center;padding:clamp(56px,11vh,130px) 0 clamp(40px,7vh,80px)}
.kicker{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--soft);margin-bottom:clamp(22px,4.5vh,44px)}
.kicker i{display:inline-block;width:28px;height:1px;background:var(--faint);vertical-align:middle;margin:0 14px;font-style:normal}
.frase{font-weight:200;font-size:clamp(42px,7.6vw,124px);line-height:.98;letter-spacing:-.04em}
.frase em{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:300;letter-spacing:-.015em;color:var(--acento)}
.frase .l{display:block;overflow:hidden;padding-bottom:.06em}
.frase .l > span{display:inline-block;transform:translateY(105%);animation:sube 1.2s cubic-bezier(.2,.7,.1,1) forwards}
.frase .l:nth-child(2) > span{animation-delay:.14s}
.frase .l:nth-child(3) > span{animation-delay:.28s}
@keyframes sube{to{transform:none}}
@keyframes aparece{to{opacity:1}}

/* ---------- Base ---------- */
.base{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;opacity:0;animation:aparece 1s 1.1s forwards}
.firma{font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--faint);writing-mode:vertical-rl;transform:rotate(180deg)}

/* ---------- Minicalendario ---------- */
.cal{width:340px;background:rgba(255,255,255,.92);backdrop-filter:blur(4px)}
.cal-cab{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
.cal-mes{font-weight:200;font-size:36px;letter-spacing:-.03em;line-height:1;text-transform:capitalize}
.cal-mes small{font-size:10px;letter-spacing:.3em;color:var(--faint);margin-left:10px;font-weight:300;vertical-align:middle}
.cal-nav{display:flex;gap:6px}
.cal-nav button{background:none;border:1px solid var(--line);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:13px;font-weight:300;line-height:1;transition:border-color .2s}
.cal-nav button:hover:not(:disabled){border-color:var(--ink)}
.cal-nav button:disabled{opacity:.25;cursor:default}
.cal-sem,.cal-dias{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-sem span{font-size:9px;letter-spacing:.16em;color:var(--faint);text-align:center;padding-bottom:6px}
.dia{position:relative;isolation:isolate;height:38px;display:grid;place-items:center;font-size:12.5px;color:#a3a3a3;transition:opacity .25s}
.dia .n{position:relative;width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.dia.ev,.dia.in{color:var(--ink);font-weight:500;cursor:pointer}
.dia.ev{color:#fff}
.dia.ev::before,.dia.in::before{content:"";position:absolute;z-index:-1;top:4px;bottom:4px;left:4px;right:4px;border-radius:15px}
.dia.ev::before{background:var(--ink)}
.dia.in::before{background:#e9e1d4}
.dia.p::before{left:0;right:0;border-radius:0}
.dia.p.p-ini::before{left:4px;border-radius:15px 0 0 15px}
.dia.p.p-fin::before{right:4px;border-radius:0 15px 15px 0}
.dia.p.p-ini.p-fin::before{border-radius:15px}
.dia.cierre .n{box-shadow:0 0 0 1px var(--ink)}
.dia.hoy .n::after{content:"";position:absolute;bottom:3px;width:3px;height:3px;border-radius:50%;background:currentColor}
.cal.foco .dia.ev:not(.luz),.cal.foco .dia.in:not(.luz){opacity:.22}
.cal.foco .ag:not(.luz){opacity:.3}
.cal-ag{margin-top:18px;border-top:1px solid var(--ink)}
.ag{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);text-decoration:none;transition:opacity .25s;cursor:default}
a.ag{cursor:pointer}
.ag-f b{display:block;font-weight:200;font-size:28px;letter-spacing:-.03em;line-height:1}
.ag-f small{display:block;font-size:9px;letter-spacing:.28em;color:var(--soft);margin-top:5px}
.ag-tit{display:block;font-size:14px;font-weight:400;line-height:1.3}
.ag-tp{display:flex;align-items:center;gap:7px;font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-top:5px}
.sw{width:16px;height:7px;border-radius:4px;flex:none}
.sw.ev{background:var(--ink)}
.sw.in{background:#e9e1d4}
a.ag:hover .ag-tit{text-decoration:underline;text-underline-offset:3px}
.ag.pasado{opacity:.4}
.ag-vacio{padding:14px 0;font-size:12px;color:var(--soft);border-bottom:1px solid var(--line)}
.pronto{margin-top:12px;font-size:10.5px;color:var(--soft);line-height:1.6}
.pronto b{font-weight:400;letter-spacing:.24em;font-size:8.5px;text-transform:uppercase;color:var(--faint);margin-right:8px}

/* ---------- Escaparate de eventos ---------- */
.escaparate{min-width:0;margin:0 calc(var(--borde) * -1) clamp(64px,11vh,120px);opacity:0;animation:aparece 1s .9s forwards}
.esc-cab{display:flex;justify-content:space-between;align-items:flex-end;padding:0 var(--borde);margin-bottom:18px}
.esc-tit{font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--soft)}
.esc-tit b{font-weight:400;color:var(--ink);margin-right:14px}
.esc-nav{display:flex;align-items:center;gap:14px}
.esc-cont{font-size:10px;letter-spacing:.2em;color:var(--soft);min-width:52px;text-align:right}
.esc-nav button{background:none;border:1px solid var(--line);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:14px;font-weight:300;transition:border-color .2s,opacity .2s}
.esc-nav button:hover:not(:disabled){border-color:var(--ink)}
.esc-nav button:disabled{opacity:.25;cursor:default}
.esc-pista{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 var(--borde);padding:0 var(--borde) 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.esc-pista::-webkit-scrollbar{display:none}
.esc-pista::after{content:"";flex:0 0 1px}
.vit:first-child{margin-left:auto}
.vit:last-child{margin-right:auto}
.escaparate.cabe .esc-cab{justify-content:center}
.escaparate.cabe .esc-nav,.escaparate.cabe .esc-barra{visibility:hidden}
.vit{flex:0 0 clamp(200px,calc((100vw - 2 * var(--borde) - (var(--n,4) - 1) * 20px - 26px) / var(--n,4)),300px);scroll-snap-align:start;text-decoration:none;color:inherit;cursor:pointer}
.vit-card{position:relative;aspect-ratio:4 / 5;background:#f4f0ea;padding:20px 22px 22px;display:flex;flex-direction:column;overflow:hidden;transition:background .5s,transform .6s cubic-bezier(.2,.7,.1,1)}
.vit-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vt-top{display:flex;justify-content:space-between;align-items:flex-start}
.vt-num{font-size:9.5px;letter-spacing:.3em;color:var(--soft);padding-top:6px}
.vit-nuevo{background:var(--acento);color:#fff;font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;padding:5px 9px 4px}
.vt-ico{width:54px;height:54px;border-radius:50%;border:1px solid rgba(17,17,17,.18);display:grid;place-items:center;background:#fff;transition:transform .8s cubic-bezier(.2,.7,.1,1),border-color .4s}
.vt-ico svg{width:34px;height:34px;overflow:visible}
.vt-ico svg *{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.vt-nom{margin-top:auto;font-weight:300;font-size:clamp(26px,2.3vw,34px);line-height:1.04;letter-spacing:-.025em;color:var(--ink)}
.vt-nom em{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:400;font-size:1.12em;letter-spacing:-.01em;color:var(--acento)}
.vt-pie{margin-top:18px;padding-top:12px;border-top:1px solid rgba(17,17,17,.75);display:flex;flex-direction:column;gap:6px}
.vt-fecha{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.vt-est{display:inline-flex;align-items:center;gap:7px;font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft)}
.vt-est::before{content:"";width:4px;height:4px;border-radius:50%;background:currentColor}
.vt-est.vivo{color:var(--acento)}
.vit:hover .vit-card{background:#ece5da;transform:translateY(-4px)}
.vit:hover .vt-ico{transform:rotate(-10deg) scale(1.06);border-color:var(--ink)}
.esc-barra{margin:22px var(--borde) 0;height:1px;background:var(--line);position:relative}
.esc-barra i{position:absolute;left:0;top:0;height:1px;background:var(--ink);transition:left .3s,width .3s}

/* ---------- Asistente ---------- */
.asis{position:fixed;top:0;right:var(--asis-x);z-index:20;display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;animation:balanceo 5.5s ease-in-out infinite}
.hilo{width:1px;height:var(--hilo);background:var(--ink);transform-origin:top;animation:baja 1.4s cubic-bezier(.3,.8,.2,1) both}
.bola{background:none;border:0;cursor:pointer;display:block;width:78px;animation:aparece .6s .9s both}
.bola svg{display:block;width:100%;height:auto;overflow:visible}
.bola:focus-visible{outline:1px solid var(--ink);outline-offset:6px}
.asis-nombre{margin-top:8px;font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:var(--soft);animation:aparece .6s 1.2s both}
/* al pasar el ratón la bola deja de balancearse, para que sea fácil de pulsar */
.asis:hover,.asis:has(.bola:focus-visible){animation-play-state:paused}
.asis.salta .bola svg{animation:salto .7s cubic-bezier(.3,1.6,.5,1)}
.ojos{transition:transform .5s}
.asis.mira .ojos{transform:translateY(2px)}
.parpado{transform-box:fill-box;transform-origin:center;animation:parpadeo 5s infinite}
@keyframes balanceo{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-2deg)}}
@keyframes baja{from{transform:scaleY(0)}}
@keyframes salto{0%{transform:none}35%{transform:translateY(-9px) rotate(-4deg)}100%{transform:none}}
@keyframes parpadeo{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}

/* ---------- Cartel ---------- */
.cartel{position:fixed;z-index:19;--cr:max(var(--borde),calc(var(--asis-x) - 60px));top:calc(var(--hilo) + 134px);right:var(--cr);width:300px;background:#fff;border:1px solid var(--ink);padding:20px 22px 0;opacity:0;transform:translateY(-8px);transition:opacity .45s,transform .45s cubic-bezier(.2,.7,.1,1);pointer-events:none}
.cartel.on{opacity:1;transform:none;pointer-events:auto}
.flecha{position:absolute;top:-6px;right:calc(var(--asis-x) + 39px - var(--cr) - 6px);width:11px;height:11px;background:#fff;border-top:1px solid var(--ink);border-left:1px solid var(--ink);transform:rotate(45deg)}
.c-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--soft);margin-bottom:14px}
.c-nuevo{color:var(--acento);font-weight:500}
.c-x{background:none;border:0;cursor:pointer;font-size:16px;font-weight:200;line-height:1;margin:-4px -6px 0 auto;padding:2px 6px;color:var(--soft)}
.c-x:hover{color:var(--ink)}
.c-tit{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:27px;line-height:1.04;letter-spacing:-.01em;margin-bottom:10px}
.c-txt{font-size:13px;line-height:1.55;color:#3a3a3a}
.c-pie{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;padding:12px 0 14px;border-top:1px solid var(--line);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
.c-pie a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:1px}
.c-puntos{display:flex;gap:5px}
.c-nav{display:flex;align-items:center;gap:4px}
.c-flecha{background:none;border:0;cursor:pointer;font-size:18px;font-weight:300;line-height:1;padding:2px 6px;color:var(--soft)}
.c-flecha:hover{color:var(--ink)}
.c-puntos button{width:14px;height:20px;border:0;background:none;cursor:pointer;position:relative}
.c-puntos button::after{content:"";position:absolute;left:0;right:0;top:9px;height:1px;background:var(--line)}
.c-puntos button.on::after{background:var(--ink)}
.c-prog{position:absolute;left:-1px;bottom:-1px;height:1px;background:var(--ink);width:0}

/* ---------- Panel Cesta de Navidad ---------- */
.ces{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px 16px;background:rgba(17,17,17,.42);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.ces.on{opacity:1;visibility:visible}
.ces-in{position:relative;width:min(620px,100%);max-height:calc(100svh - 48px);overflow:auto;background:#fff;padding:clamp(28px,5vw,48px);transform:translateY(18px) scale(.98);transition:transform .55s cubic-bezier(.2,.7,.1,1)}
.ces.on .ces-in{transform:none}
.ces-x{position:absolute;top:10px;right:12px;background:none;border:0;cursor:pointer;font-size:28px;font-weight:200;line-height:1;padding:6px 10px;color:var(--ink)}
.ces-k{padding-right:34px;font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--soft)}
.ces-t{margin-top:12px;font-weight:200;font-size:clamp(34px,5vw,52px);line-height:1;letter-spacing:-.035em}
.ces-t em{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:300;letter-spacing:-.01em;color:var(--acento)}
.ces-pasos{list-style:none;margin-top:30px;border-top:1px solid var(--ink)}
.ces-pasos li{display:grid;grid-template-columns:56px 1fr;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
.ces-n{font-weight:200;font-size:40px;letter-spacing:-.04em;line-height:.9;color:var(--acento)}
.ces-pt{font-size:17px;font-weight:400;line-height:1.25}
.ces-pd{margin-top:6px;font-size:14px;line-height:1.55;color:#3a3a3a}
.ces-ok{margin-top:26px;background:var(--ink);color:#fff;border:0;cursor:pointer;font:inherit;font-size:10px;letter-spacing:.28em;text-transform:uppercase;padding:14px 26px}
.ces-ok:hover{background:var(--acento)}

/* ---------- Responsive ---------- */
@media (max-width:760px){
  .indice{grid-template-columns:repeat(2,1fr)}
  .escaparate{margin:0 0 72px}
  .esc-cab{padding:0;justify-content:space-between}
  .esc-nav,.esc-barra{display:none}
  .esc-pista{display:grid;grid-template-columns:1fr 1fr;gap:14px;overflow:visible;padding:0}
  .esc-pista::after{display:none}
  .vit{flex:none;width:auto;margin:0 !important}
  .vit:last-child:nth-child(odd){grid-column:1 / -1}
  .vit:last-child:nth-child(odd) .vit-card{aspect-ratio:auto;min-height:190px}
  .vit-card{padding:13px 13px 14px}
  .vt-num,.vit-nuevo{font-size:7.5px}
  .vit-nuevo{padding:4px 6px 3px}
  .vt-ico{width:38px;height:38px}
  .vt-ico svg{width:24px;height:24px}
  .vt-nom{font-size:19px}
  .vt-pie{margin-top:12px;padding-top:9px;gap:4px}
  .vt-fecha{font-size:8.5px;letter-spacing:.16em}
  .vt-est{font-size:7px;letter-spacing:.14em}
  .cal{margin-top:8px}
  :root{--hilo:7vh;--asis-x:18px}
  .top{justify-content:flex-start;padding-right:80px}
  .logo{width:min(300px,62vw)}
  .bola{width:54px}
  .asis-nombre{font-size:8px}
  .hero{text-align:left;padding:72px 0 56px}
  .kicker i{width:14px;margin:0 8px}
  .base{flex-direction:column;align-items:stretch}
  .cal{width:100%}
  .firma{display:none}
  .cartel{top:auto;bottom:16px;left:16px;right:16px;width:auto;transform:translateY(14px);box-shadow:0 18px 50px rgba(0,0,0,.12)}
  .flecha{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .frase .l > span{transform:none}
  .base{opacity:1}
}

/* ===== Móvil: Noa discreto y más aire ===== */
.bola{position:relative}
.asis-badge{position:absolute;top:10px;right:-2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--acento);color:#fff;font:500 9.5px/17px 'Inter Tight',sans-serif;text-align:center;display:none;box-shadow:0 0 0 2px #fff}
.asis.pendiente .asis-badge{display:block;animation:latido 1.8s ease-in-out infinite}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.cartel-fondo{position:fixed;inset:0;z-index:18;background:rgba(17,17,17,.28);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
@media (max-width:760px){
  :root{--borde:22px;--hilo:3vh;--asis-x:12px}
  .top{padding-right:58px}
  .bola{width:44px}
  .asis-nombre{display:none}
  .asis{animation:none}   /* quieta en el móvil: más fácil de tocar */
  .kicker{font-size:9.5px;letter-spacing:.24em;line-height:2}
  .hero{padding:52px 0 52px}
  body.noa-abierta .cartel-fondo{opacity:1;visibility:visible}
  .cartel{left:0;right:0;bottom:0;width:auto;max-height:62vh;overflow:auto;border:0;border-top:1px solid var(--ink);padding:22px 22px 0;box-shadow:0 -20px 50px rgba(0,0,0,.18)}
  .c-tit{font-size:24px}
}
</style>
</head>
<body>
<canvas id="nieve" aria-hidden="true"></canvas>

<div class="pagina">
  <header class="top">
    <img class="logo" src="logo.png" alt="Plataforma Europa · Inditex">
  </header>

  <main class="hero">
    <p class="kicker">Navidad <i></i> Fin de año 2026</p>
    <h1 class="frase" id="frase"></h1>
  </main>

  <section class="escaparate" id="indice" aria-label="Eventos">
    <div class="esc-cab">
      <span class="esc-tit"><b>Eventos</b><span id="escNum"></span></span>
      <div class="esc-nav"><span class="esc-cont" id="escCont"></span><button id="escAnt" aria-label="Anterior">←</button><button id="escSig" aria-label="Siguiente">→</button></div>
    </div>
    <div class="esc-pista" id="escPista"></div>
    <div class="esc-barra"><i id="escBarra"></i></div>
  </section>

  <footer class="base">
    <section class="cal" id="cal" aria-label="Calendario de eventos">
      <div class="cal-cab">
        <span class="cal-mes" id="calMes"></span>
        <div class="cal-nav">
          <button id="calAnt" aria-label="Mes anterior">←</button>
          <button id="calSig" aria-label="Mes siguiente">→</button>
        </div>
      </div>
      <div class="cal-sem"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
      <div class="cal-dias" id="calDias"></div>
      <div class="cal-ag" id="calAg"></div>
      <div class="pronto" id="pronto"></div>
    </section>
    <span class="firma">Plataforma Europa · 2026</span>
  </footer>
</div>

<div class="ces" id="ces" role="dialog" aria-modal="true" aria-labelledby="cesT">
  <div class="ces-in">
    <button class="ces-x" id="cesX" aria-label="Cerrar">×</button>
    <p class="ces-k">Navidad 2026 · Plataforma Europa</p>
    <h2 class="ces-t" id="cesT"></h2>
    <ol class="ces-pasos" id="cesPasos"></ol>
    <button class="ces-ok" id="cesOk">Entendido</button>
  </div>
</div>

<!-- Asistente -->
<div class="asis" id="asis">
  <div class="hilo"></div>
  <button class="bola" id="bola" aria-label="Ver novedades">
    <span class="asis-badge" id="asisBadge"></span>
    <svg viewBox="0 0 80 96" aria-hidden="true">
      <circle cx="40" cy="4.5" r="3.5" fill="none" stroke="#111" stroke-width="1.1"/>
      <rect x="32" y="8" width="16" height="9.5" rx="1.5" fill="#9b1c25" stroke="#111" stroke-width="1.1"/>
      <line x1="36.5" y1="8.5" x2="36.5" y2="17" stroke="#fff" stroke-opacity=".55" stroke-width=".7"/>
      <line x1="40" y1="8.5" x2="40" y2="17" stroke="#fff" stroke-opacity=".55" stroke-width=".7"/>
      <line x1="43.5" y1="8.5" x2="43.5" y2="17" stroke="#fff" stroke-opacity=".55" stroke-width=".7"/>
      <circle cx="40" cy="55" r="36" fill="#f3efe9" stroke="#111" stroke-width="1.2"/>
      <path d="M15 37 A28 28 0 0 1 29 24.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M8.5 71 Q40 84 71.5 71" fill="none" stroke="#111" stroke-width=".7"/>
      <path d="M11.5 77 Q40 89 68.5 77" fill="none" stroke="#111" stroke-width=".7"/>
      <g class="ojos">
        <ellipse class="parpado" cx="31" cy="52" rx="2.3" ry="3.2" fill="#111"/>
        <ellipse class="parpado" cx="49" cy="52" rx="2.3" ry="3.2" fill="#111"/>
        <path d="M35 60.5 Q40 65 45 60.5" fill="none" stroke="#111" stroke-width="1.3" stroke-linecap="round"/>
      </g>
    </svg>
  </button>
  <span class="asis-nombre" id="asisNombre"></span>
</div>

<div class="cartel-fondo" id="cartelFondo"></div>
<aside class="cartel" id="cartel" aria-live="polite">
  <span class="flecha"></span>
  <div class="c-cab"><span id="cEvento"></span><span class="c-nuevo" id="cNuevo"></span><button class="c-x" id="cX" aria-label="Cerrar">×</button></div>
  <p class="c-tit" id="cTit"></p>
  <p class="c-txt" id="cTxt"></p>
  <div class="c-pie"><span id="cFecha"></span><div class="c-nav"><button class="c-flecha" id="cAnt" aria-label="Aviso anterior">‹</button><div class="c-puntos" id="cPuntos"></div><button class="c-flecha" id="cSig" aria-label="Aviso siguiente">›</button></div><span id="cLink"></span></div>
  <span class="c-prog" id="cProg"></span>
</aside>

<script>
/* =====================================================================
   CONFIGURACIÓN — todo lo que se cambia está aquí
   ===================================================================== */
const CONFIG = {

  // Frase principal. Cada "|" es un salto de línea. *palabra* = cursiva.
  frase: "Todo lo que nos *une*|este fin de año.",

  // Asistente
  asistente: {
    nombre: "Noa",
    activo: true,
    segundos: 8,            // tiempo que se muestra cada cartel
    vueltas: 1,             // veces que repasa todos los carteles antes de esconderse (0 = siempre)
    diasNuevo: 3,           // un aviso se marca como "Nuevo" durante estos días
    saludo: {
      titulo: "Hola, soy Noa",
      texto: "Te iré contando aquí lo último que se publique de cada evento."
    }
  },

  // Carteles del asistente. Se muestran del más reciente al más antiguo.
  // enlace: deja "" si todavía no hay página del evento.
  avisos: [
    { fecha: "2026-10-21", evento: "Mercadillo Solidario",
      titulo: "Del 10 al 18 de diciembre",
      texto: "Reserva estos días. Ya puedes apuntarte como voluntario y conocer Solidary Talent, Percha Zero y el proyecto al que ayudamos.",
      enlace: "mercadillo.html" },
    { fecha: "2026-10-20", evento: "Fiesta infantil",
      titulo: "Guarda la fecha: 20 de diciembre",
      texto: "Celebramos la fiesta infantil de Navidad. Pronto publicaremos el programa y las inscripciones.",
      enlace: "fiesta.html" },
    { fecha: "2026-10-19", evento: "Próximamente",
      titulo: "Puertas abiertas y Mercado km 0",
      texto: "Estamos cerrando las fechas. Te avisaremos aquí en cuanto estén.",
      enlace: "" }
  ],

  // Calendario. tipo: "evento" o "inscripcion".
  // Eventos de varios días: inicio + fin. Inscripción: el círculo se marca en la fecha de fin.
  calendario: [
    { tipo: "evento", titulo: "Mercadillo Solidario", inicio: "2026-12-10", fin: "2026-12-18", enlace: "mercadillo.html" },
    { tipo: "evento", titulo: "Entrega de la Cesta de Navidad", inicio: "2026-12-15", enlace: "#cesta-navidad" },
    { tipo: "evento", titulo: "Fiesta infantil", inicio: "2026-12-20", enlace: "fiesta.html" },
    { tipo: "evento", titulo: "Jornadas de puertas abiertas", inicio: "2026-12-21", fin: "2026-12-22", enlace: "puertas-abiertas.html" },
    // EJEMPLO — sustituir por el plazo real o borrar esta línea:
    { tipo: "inscripcion", titulo: "Inscripción fiesta infantil · ejemplo", inicio: "2026-11-16", fin: "2026-11-30", enlace: "" }
  ],

  // Eventos aún sin fecha (aparecen bajo el calendario)
  sinFecha: ["El Mercado km 0"],

  // Eventos de la home. inicio/fin: "AAAA-MM-DD" (vacío = por anunciar).
  // estado: texto opcional (ej. "Inscripciones abiertas"); si está vacío se calcula con la fecha.
  // nombre: *palabra* = cursiva. imagen: opcional; si se pone, sustituye a la tarjeta tipográfica.
  // Instrucciones de la Cesta de Navidad (se abren al pulsar su tarjeta)
  cesta: {
    titulo: "Tu *Cesta de Navidad*",
    pasos: [
      { t: "Desde el 15 de diciembre", d: "Las cestas se entregarán a partir del 15 de diciembre." },
      { t: "Escanea tu QR de Inet", d: "Para recogerla, escanea tu código QR de Inet en las PDA que habrá ubicadas en cada sección." },
      { t: "¿La recoge otra persona?", d: "Si tu cesta va a recogerla un compañero o compañera de trabajo, pásale un pantallazo de tu QR para que pueda recogerla." }
    ]
  },

  eventos: [
    { nombre: "Mercadillo *Solidario*", inicio: "2026-12-10", fin: "2026-12-18", estado: "Voluntariado abierto", imagen: "", ilustracion: "percha", enlace: "mercadillo.html" },
    { nombre: "Cesta de *Navidad*", inicio: "2026-12-15", fin: "", desde: true, estado: "Cómo recogerla", imagen: "", ilustracion: "cesta", ficha: "cesta" },
    { nombre: "Fiesta *infantil*", inicio: "2026-12-20", fin: "", estado: "", imagen: "", ilustracion: "corona", enlace: "fiesta.html" },
    { nombre: "Puertas *Abiertas*", inicio: "2026-12-21", fin: "2026-12-22", estado: "", imagen: "", ilustracion: "almacen", enlace: "puertas-abiertas.html" },
    { nombre: "Mercado *km 0*", inicio: "", fin: "", estado: "", imagen: "", ilustracion: "dulce", enlace: "mercado-km0.html" }
  ],

  nieve: true
};
/* ===================================================================== */

(function () {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const hoy = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
  const key = d => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  const corto = d => new Intl.DateTimeFormat('es-ES', { day:'numeric', month:'short' }).format(d).replace('.', '').toUpperCase();
  const mesTxt = d => new Intl.DateTimeFormat('es-ES', { month:'long', year:'numeric' }).format(d).replace(' de ', ' ');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Frase ---------- */
  $('frase').innerHTML = CONFIG.frase.split('|').map(l =>
    `<span class="l"><span>${esc(l).replace(/\*(.+?)\*/g, '<em>$1</em>')}</span></span>`).join('');

  /* ---------- Calendario ---------- */
  const items = CONFIG.calendario.map((x, n) => ({ ...x, id: n, a: parse(x.inicio), b: parse(x.fin || x.inicio) }));
  const porDia = {};
  items.forEach(it => {
    for (let d = new Date(it.a); d <= it.b; d.setDate(d.getDate() + 1)) (porDia[key(d)] ||= []).push(it);
  });
  const mIdx = d => d.getFullYear() * 12 + d.getMonth();
  const meses = items.flatMap(i => [mIdx(i.a), mIdx(i.b)]);
  const minM = Math.min(...meses), maxM = Math.max(...meses);
  const prox = items.filter(i => i.b >= hoy).sort((x, y) => x.a - y.a);
  const ref = prox.find(i => i.tipo === 'evento') || prox[0] || items[0];
  let mes = mIdx(ref.a < hoy && ref.b >= hoy ? hoy : ref.a);
  const MES = d => new Intl.DateTimeFormat('es-ES', { month:'short' }).format(d).replace('.', '').toUpperCase();

  function fechaAg(it) {
    if (+it.a === +it.b) return { b: it.a.getDate(), s: MES(it.a) };
    if (it.a.getMonth() === it.b.getMonth()) return { b: it.a.getDate() + '–' + it.b.getDate(), s: MES(it.b) };
    return { b: it.a.getDate() + '–' + it.b.getDate(), s: MES(it.a) + ' – ' + MES(it.b) };
  }

  function pintaCal() {
    const y = Math.floor(mes / 12), m = mes % 12;
    const primero = new Date(y, m, 1), total = new Date(y, m + 1, 0).getDate();
    const hueco = (primero.getDay() + 6) % 7;
    const nombre = new Intl.DateTimeFormat('es-ES', { month:'long' }).format(primero);
    $('calMes').innerHTML = `${esc(nombre)}<small>${y}</small>`;
    $('calAnt').disabled = mes <= minM;
    $('calSig').disabled = mes >= maxM;

    let h = '';
    for (let i = 0; i < hueco; i++) h += '<span class="dia"></span>';
    for (let d = 1; d <= total; d++) {
      const f = new Date(y, m, d), es = porDia[key(f)] || [];
      const ev = es.find(e => e.tipo === 'evento'), ins = es.find(e => e.tipo === 'inscripcion');
      const it = ev || ins, c = ['dia'];
      if (it) {
        c.push(ev ? 'ev' : 'in');
        if (+it.a !== +it.b) {
          c.push('p');
          if (+f === +it.a || f.getDay() === 1 || d === 1) c.push('p-ini');
          if (+f === +it.b || f.getDay() === 0 || d === total) c.push('p-fin');
        }
      }
      if (ins && +f === +ins.b) c.push('cierre');
      if (+f === +hoy) c.push('hoy');
      const ids = es.map(e => e.id).join(' ');
      h += `<span class="${c.join(' ')}"${ids ? ` data-ids="${ids}" title="${esc(es.map(e => e.titulo).join(' · '))}"` : ''}><span class="n">${d}</span></span>`;
    }
    $('calDias').innerHTML = h;

    const delMes = items.filter(i => mIdx(i.a) <= mes && mIdx(i.b) >= mes).sort((p, q) => p.a - q.a);
    $('calAg').innerHTML = delMes.length ? delMes.map(it => {
      const fa = fechaAg(it), tipo = it.tipo === 'evento' ? 'Evento' : 'Plazo de inscripción';
      const inner = `<span class="ag-f"><b>${fa.b}</b><small>${fa.s}</small></span>
        <span><span class="ag-tit">${esc(it.titulo)}</span><span class="ag-tp"><i class="sw ${it.tipo === 'evento' ? 'ev' : 'in'}"></i>${tipo}</span></span>`;
      const cls = 'ag' + (it.b < hoy ? ' pasado' : '');
      return it.enlace ? `<a class="${cls}" data-ids="${it.id}" href="${esc(it.enlace)}">${inner}</a>` : `<div class="${cls}" data-ids="${it.id}">${inner}</div>`;
    }).join('') : '<div class="ag-vacio">Sin fechas este mes.</div>';
  }

  // Resaltado cruzado: al pasar por un día se ilumina su evento, y viceversa
  const cal = $('cal');
  let fijo = null;
  function foco(ids) {
    cal.querySelectorAll('.luz').forEach(e => e.classList.remove('luz'));
    if (!ids) { cal.classList.remove('foco'); return; }
    const set = new Set(ids.split(' '));
    cal.querySelectorAll('[data-ids]').forEach(e => { if (e.dataset.ids.split(' ').some(x => set.has(x))) e.classList.add('luz'); });
    cal.classList.add('foco');
  }
  cal.addEventListener('mouseover', e => { const t = e.target.closest('[data-ids]'); if (!fijo) foco(t ? t.dataset.ids : null); });
  cal.addEventListener('mouseleave', () => foco(fijo));
  cal.addEventListener('click', e => {
    const t = e.target.closest('.dia[data-ids]'); if (!t) return;
    fijo = fijo === t.dataset.ids ? null : t.dataset.ids; foco(fijo);
  });
  $('calAnt').onclick = () => { mes--; fijo = null; pintaCal(); foco(null); };
  $('calSig').onclick = () => { mes++; fijo = null; pintaCal(); foco(null); };
  $('pronto').innerHTML = CONFIG.sinFecha.length ? `<b>Por anunciar</b>${CONFIG.sinFecha.map(s => `<span style="white-space:nowrap">${esc(s)}</span>`).join(' · ')}` : '';
  pintaCal();

  /* ---------- Árbol de eventos ---------- */
  // Trazos de cada adorno (se ven en gris y se oscurecen al pasar el ratón)
  const GLIFOS = {
    percha:  '<path d="M45 31 C45 24 55 24 55 31 C55 36 50 37 50 43"/><path d="M50 43 L20 64 H80 Z"/>',
    corona:  '<path d="M24 64 V38 L37 52 L50 32 L63 52 L76 38 V64 Z"/><path d="M24 71 H76"/>',
    // Nave central con un silo bajo a cada lado; todos con tejado plano
    almacen: '<path d="M8 70 H92"/><path d="M31 70 V42 H69 V70"/><path d="M44 70 V58 H56 V70"/><path d="M15 70 V53 H27 V70"/><path d="M15 61.5 H27"/><path d="M73 70 V53 H85 V70"/><path d="M73 61.5 H85"/>',
    // Croissant: media luna con gajos y puntas hacia abajo
    cesta:   '<path d="M18 48 H82 L74 80 H26 Z"/><path d="M30 48 Q50 14 70 48"/><path d="M22 60 H78 M24 70 H76 M40 48 L42 80 M60 48 L58 80"/>',
    dulce:   '<path d="M14 66 Q14.5 54.6 26 48 Q29.4 36 40 36 Q50 28 60 36 Q70.6 36 74 48 Q85.5 54.6 86 66 Q50 50 14 66 Z"/><path d="M26 48 Q31 54 32 60 M40 36 Q43 47 43 58.4 M60 36 Q57 47 57 58.4 M74 48 Q69 54 68 60"/>'
  };

  // Novedad automática: el último aviso de Noa que enlaza a ese evento, si es de los últimos 7 días
  const novedad = e => {
    if (!e.enlace) return null;
    const av = CONFIG.avisos.filter(a => a.enlace === e.enlace && (hoy - parse(a.fecha)) / 864e5 <= 7)
      .sort((x, y) => y.fecha.localeCompare(x.fecha));
    return av[0] || null;
  };
  // Los eventos con novedad se muestran primero
  const lista = CONFIG.eventos.map((e, n) => ({ e, n, nov: novedad(e) }))
    .sort((a, b) => (b.nov ? 1 : 0) - (a.nov ? 1 : 0) || a.n - b.n);
  const pista = $('escPista');
  const MES3 = d => new Intl.DateTimeFormat('es-ES', { month:'short' }).format(d).replace('.', '');
  const MESL = d => new Intl.DateTimeFormat('es-ES', { month:'long' }).format(d);
  function fechaGrande(e) {
    if (!e.inicio) return { dia: 'Pronto', mes: 'Fecha por anunciar', pronto: true };
    const a = parse(e.inicio), b = e.fin ? parse(e.fin) : a;
    if (e.desde) return { dia: String(a.getDate()), mes: 'Desde el ' + a.getDate() + ' de ' + MESL(a) };
    if (+a === +b) return { dia: String(a.getDate()), mes: MESL(a) };
    if (a.getMonth() === b.getMonth()) return { dia: a.getDate() + '–' + b.getDate(), mes: MESL(a) };
    return { dia: a.getDate() + '–' + b.getDate(), mes: MESL(a).slice(0,3) + ' – ' + MESL(b).slice(0,3) };
  }
  function estadoEv(e) {
    if (e.estado) return { t: e.estado, vivo: true };
    if (!e.inicio) return { t: 'Muy pronto', vivo: false };
    const a = parse(e.inicio), b = e.fin ? parse(e.fin) : a;
    if (hoy > b) return { t: 'Finalizado', vivo: false };
    if (hoy >= a) return { t: 'Hoy · en curso', vivo: true };
    const d = Math.round((a - hoy) / 864e5);
    return { t: d === 1 ? 'Mañana' : 'Faltan ' + d + ' días', vivo: d <= 7 };
  }
  pista.innerHTML = lista.map(({ e, n, nov }) => {
    const tag = e.enlace ? 'a' : 'div';
    const f = fechaGrande(e), st = estadoEv(e);
    const fechaTxt = !e.inicio ? 'Fecha por anunciar'
      : e.desde ? 'Desde el ' + f.dia + ' ' + MES3(parse(e.inicio))
      : f.dia.replace('–', ' — ') + ' ' + MES3(parse(e.fin || e.inicio));
    const nombre = esc(e.nombre).replace(/\*(.+?)\*/g, '<em>$1</em>');
    const cuerpo = e.imagen ? `<img src="${esc(e.imagen)}" alt="">` : `
        <div class="vt-top">
          ${nov ? '<span class="vit-nuevo">Nuevo</span>' : `<span class="vt-num">${String(n + 1).padStart(2, '0')}</span>`}
          <span class="vt-ico"><svg viewBox="0 0 100 100" aria-hidden="true">${GLIFOS[e.ilustracion] || ''}</svg></span>
        </div>
        <h3 class="vt-nom">${nombre}</h3>
        <div class="vt-pie">
          <span class="vt-fecha">${esc(fechaTxt)}</span>
          <span class="vt-est${st.vivo ? ' vivo' : ''}">${esc(st.t)}</span>
        </div>`;
    if (e.ficha) return `<a class="vit" href="#cesta-navidad" data-ficha="${esc(e.ficha)}"><div class="vit-card">${cuerpo}</div></a>`;
    return `<${tag} class="vit"${e.enlace ? ` href="${esc(e.enlace)}"` : ''}>
      <div class="vit-card">${cuerpo}</div>
      </${tag}>`;
  }).join('');
  $('escNum').textContent = String(lista.length).padStart(2, '0');
  pista.style.setProperty('--n', lista.length);

  /* ---------- Panel Cesta de Navidad ---------- */
  const ces = $('ces'), C = CONFIG.cesta;
  $('cesT').innerHTML = esc(C.titulo).replace(/\*(.+?)\*/g, '<em>$1</em>');
  $('cesPasos').innerHTML = C.pasos.map((s, k) => `<li><span class="ces-n">${k + 1}</span><div><div class="ces-pt">${esc(s.t)}</div><div class="ces-pd">${esc(s.d)}</div></div></li>`).join('');
  function abrirCesta() { ces.classList.add('on'); document.body.style.overflow = 'hidden'; if (typeof cerrarCartel === 'function') cerrarCartel(); $('cesX').focus(); }
  function cerrarCesta() { ces.classList.remove('on'); document.body.style.overflow = ''; if (location.hash === '#cesta-navidad') history.replaceState(null, '', location.pathname + location.search); }
  // Se abre desde su tarjeta, desde el calendario o con el enlace directo index.html#cesta-navidad
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href="#cesta-navidad"]'); if (!a) return;
    e.preventDefault(); history.replaceState(null, '', '#cesta-navidad'); abrirCesta();
  });
  $('cesX').onclick = cerrarCesta; $('cesOk').onclick = cerrarCesta;
  ces.addEventListener('click', e => { if (e.target === ces) cerrarCesta(); });
  addEventListener('keydown', e => { if (e.key === 'Escape' && ces.classList.contains('on')) cerrarCesta(); });
  if (location.hash === '#cesta-navidad') setTimeout(abrirCesta, 500);

  const paso = () => { const v = pista.querySelector('.vit'); return v ? v.getBoundingClientRect().width + 20 : 300; };
  function estadoEsc() {
    const max = pista.scrollWidth - pista.clientWidth;
    $('indice').classList.toggle('cabe', max <= 2);
    $('escAnt').disabled = pista.scrollLeft <= 2;
    $('escSig').disabled = pista.scrollLeft >= max - 2;
    const vis = pista.clientWidth / pista.scrollWidth;
    const b = $('escBarra');
    b.style.width = (vis * 100) + '%';
    b.style.left = (max > 0 ? pista.scrollLeft / max * (1 - vis) * 100 : 0) + '%';
    const primero = Math.min(lista.length, Math.round(pista.scrollLeft / paso()) + 1);
    $('escCont').textContent = String(primero).padStart(2, '0') + ' / ' + String(lista.length).padStart(2, '0');
  }
  $('escAnt').onclick = () => pista.scrollBy({ left: -paso(), behavior: 'smooth' });
  $('escSig').onclick = () => pista.scrollBy({ left: paso(), behavior: 'smooth' });
  pista.addEventListener('scroll', estadoEsc, { passive: true });
  addEventListener('resize', estadoEsc);
  estadoEsc();
  $('indice').addEventListener('mouseenter', () => { if (typeof cerrarCartel === 'function') cerrarCartel(); });

  /* ---------- Asistente ---------- */
  let cerrarCartel = null;
  const A = CONFIG.asistente, asis = $('asis'), cartel = $('cartel');
  if (!A.activo) { asis.remove(); cartel.remove(); }
  else {
    $('asisNombre').textContent = A.nombre;
    const avisos = [...CONFIG.avisos].sort((x, y) => y.fecha.localeCompare(x.fecha));
    const lista = (A.saludo ? [{ saludo: true, evento: A.nombre, titulo: A.saludo.titulo, texto: A.saludo.texto }] : []).concat(avisos);
    // manual: el usuario lo ha abierto o tocado → solo se cierra con la × (o Esc) y no avanza solo
    let i = 0, mostrados = 0, timer = null, pausa = false, abierto = false, manual = false;

    const relativo = f => {
      const dias = Math.round((hoy - parse(f)) / 864e5);
      if (dias <= 0) return 'Hoy'; if (dias === 1) return 'Ayer';
      if (dias < 7) return 'Hace ' + dias + ' días'; return corto(parse(f));
    };

    function pinta() {
      const a = lista[i];
      $('cEvento').textContent = a.evento || '';
      const nuevo = !a.saludo && a.fecha && (hoy - parse(a.fecha)) / 864e5 <= A.diasNuevo;
      $('cNuevo').textContent = a.importante ? 'Importante' : (nuevo ? 'Nuevo' : '');
      $('cTit').textContent = a.titulo;
      $('cTxt').textContent = a.texto;
      $('cFecha').textContent = a.saludo ? '' : relativo(a.fecha);
      $('cLink').innerHTML = a.enlace ? `<a href="${esc(a.enlace)}">Ver más</a>` : '';
      $('cPuntos').innerHTML = lista.length > 1 ? lista.map((_, n) => `<button class="${n === i ? 'on' : ''}" data-n="${n}" aria-label="Aviso ${n + 1}"></button>`).join('') : '';
      const p = $('cProg'); p.style.transition = 'none'; p.style.width = '0';
      if (!pausa && !manual && !reduce) requestAnimationFrame(() => requestAnimationFrame(() => { p.style.transition = `width ${A.segundos}s linear`; p.style.width = 'calc(100% + 2px)'; }));
      asis.classList.remove('salta'); void asis.offsetWidth; asis.classList.add('salta');
    }
    function abrir(n = 0) { i = n; abierto = true; cartel.classList.add('on'); asis.classList.add('mira'); asis.classList.remove('pendiente'); document.body.classList.add('noa-abierta'); pinta(); programar(); }
    function cerrar() { abierto = false; cartel.classList.remove('on'); asis.classList.remove('mira'); document.body.classList.remove('noa-abierta'); clearTimeout(timer); }
    cerrarCartel = () => { if (abierto && !manual) cerrar(); };
    function programar() {
      clearTimeout(timer);
      if (pausa || manual) return;
      timer = setTimeout(() => {
        mostrados++;
        if (A.vueltas && mostrados >= lista.length * A.vueltas) return cerrar();
        i = (i + 1) % lista.length; pinta(); programar();
      }, A.segundos * 1000);
    }

    const ir = n => { manual = true; i = (n + lista.length) % lista.length; pinta(); clearTimeout(timer); const p = $('cProg'); p.style.transition = 'none'; p.style.width = '0'; };
    // Pulsar a Noa: si está cerrado lo abre; si está abierto pasa al siguiente aviso
    $('bola').onclick = () => { if (!abierto) { manual = true; mostrados = 0; abrir(A.saludo && avisos.length ? 1 : 0); ir(i); } else ir(i + 1); };
    $('cX').onclick = () => { manual = false; cerrar(); };
    $('cAnt').onclick = () => ir(i - 1);
    $('cSig').onclick = () => ir(i + 1);
    $('cPuntos').addEventListener('click', e => { const b = e.target.closest('button'); if (b) ir(+b.dataset.n); });
    addEventListener('keydown', e => { if (e.key === 'Escape' && abierto) { manual = false; cerrar(); } });
    cartel.addEventListener('mouseenter', () => { pausa = true; clearTimeout(timer); const p = $('cProg'); p.style.transition = 'none'; });
    cartel.addEventListener('mouseleave', () => { pausa = false; if (!manual) { pinta(); programar(); } });
    $('cartelFondo').onclick = () => { manual = false; cerrar(); };
    // En ordenador saluda solo; en móvil no tapa nada: muestra un aviso con el número de novedades
    $('asisBadge').textContent = avisos.length || '';
    if (matchMedia('(max-width: 760px)').matches) { if (avisos.length) asis.classList.add('pendiente'); }
    else setTimeout(() => abrir(0), 1900);
  }

  /* ---------- Nieve ---------- */
  if (CONFIG.nieve && !reduce) {
    const cv = $('nieve'), ctx = cv.getContext('2d');
    let W, H, copos = [];
    const crea = () => {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = W < 760 ? 22 : 44;
      copos = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, r: .6 + Math.random() * 1.5, v: .12 + Math.random() * .32, f: Math.random() * 6.28 }));
    };
    const ciclo = () => {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(176,166,150,.45)';
      for (const c of copos) {
        c.y += c.v; c.f += .008; c.x += Math.sin(c.f) * .18;
        if (c.y > H + 4) { c.y = -4; c.x = Math.random() * W; }
        ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, 6.283); ctx.fill();
      }
      requestAnimationFrame(ciclo);
    };
    crea(); addEventListener('resize', crea); ciclo();
  }
})();
</script>
</body>
</html>
